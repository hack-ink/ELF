x-unit: &unit
  image: ${BENCHMARK_IMAGE}
  init: true
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &unit-environment
    CHAT_API_BASE: ${BENCHMARK_CHAT_API_BASE}
    CHAT_API_KEY: ${BENCHMARK_CHAT_API_KEY}
    CHAT_MODEL: ${BENCHMARK_CHAT_MODEL}
    CHAT_REASONING_EFFORT: ${BENCHMARK_CHAT_REASONING_EFFORT}
    EMBEDDING_API_BASE: ${BENCHMARK_EMBEDDING_API_BASE}
    EMBEDDING_API_KEY: ${BENCHMARK_EMBEDDING_API_KEY}
    EMBEDDING_MODEL: ${BENCHMARK_EMBEDDING_MODEL}
    EMBEDDING_DIMENSIONS: ${BENCHMARK_EMBEDDING_DIMENSIONS}
  volumes: &unit-volumes
    - type: bind
      source: ${BENCHMARK_INPUT_HOST}
      target: /benchmark/input
      read_only: true
    - type: bind
      source: ${BENCHMARK_ARTIFACT_HOST}
      target: /benchmark/artifacts

x-honcho-environment: &honcho-environment
  DB_CONNECTION_URI: postgresql+psycopg://postgres:${BENCHMARK_POSTGRES_PASSWORD}@honcho-database:5432/postgres
  CACHE_URL: redis://honcho-redis:6379/0?suppress=true
  CACHE_ENABLED: "true"
  AUTH_USE_AUTH: "false"
  EMBED_MESSAGES: "true"
  EMBEDDING_VECTOR_DIMENSIONS: ${BENCHMARK_EMBEDDING_DIMENSIONS}
  EMBEDDING_MODEL_CONFIG__TRANSPORT: openai
  EMBEDDING_MODEL_CONFIG__MODEL: ${BENCHMARK_EMBEDDING_MODEL}
  EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: ${BENCHMARK_EMBEDDING_API_BASE}
  EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY_ENV: EMBEDDING_API_KEY
  EMBEDDING_API_KEY: ${BENCHMARK_EMBEDDING_API_KEY}
  LLM_OPENAI_API_KEY: ${BENCHMARK_CHAT_API_KEY}
  DERIVER_MODEL_CONFIG__TRANSPORT: openai
  DERIVER_MODEL_CONFIG__MODEL: ${BENCHMARK_CHAT_MODEL}
  DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: ${BENCHMARK_CHAT_API_BASE}
  DERIVER_MODEL_CONFIG__THINKING_EFFORT: ${BENCHMARK_CHAT_REASONING_EFFORT}

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: elf_benchmark
      POSTGRES_PASSWORD: ${BENCHMARK_POSTGRES_PASSWORD}
      POSTGRES_USER: elf_benchmark
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U elf_benchmark -d elf_benchmark
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - postgres-data:/var/lib/postgresql

  sag-postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: sag_benchmark
      POSTGRES_PASSWORD: ${BENCHMARK_POSTGRES_PASSWORD}
      POSTGRES_USER: sag_benchmark
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U sag_benchmark -d sag_benchmark
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - sag-postgres-data:/var/lib/postgresql

  qdrant:
    image: qdrant/qdrant:v1.18.0
    volumes:
      - qdrant-data:/qdrant/storage

  lightrag:
    image: ghcr.io/hkuds/lightrag@sha256:de09cd75e32b6b45b104625a9fb229f84f3dec4827ecffc825aa4438b196cbe6
    environment:
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      HOST: 0.0.0.0
      PORT: 9621
      LLM_BINDING: openai
      LLM_BINDING_HOST: ${BENCHMARK_CHAT_API_BASE}
      LLM_BINDING_API_KEY: ${BENCHMARK_CHAT_API_KEY}
      LLM_MODEL: ${BENCHMARK_CHAT_MODEL}
      OPENAI_LLM_REASONING_EFFORT: ${BENCHMARK_CHAT_REASONING_EFFORT}
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: ${BENCHMARK_EMBEDDING_API_BASE}
      EMBEDDING_BINDING_API_KEY: ${BENCHMARK_EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${BENCHMARK_EMBEDDING_MODEL}
      EMBEDDING_DIM: ${BENCHMARK_EMBEDDING_DIMENSIONS}
      EMBEDDING_SEND_DIM: "true"
      RERANK_BY_DEFAULT: "False"
      MAX_ASYNC_LLM: 1
      MAX_ASYNC_RERANK: 1
      MAX_PARALLEL_INSERT: 1
      CHUNK_SIZE: 320
      CHUNK_OVERLAP_SIZE: 32
    volumes:
      - lightrag-data:/app/data/rag_storage
      - lightrag-inputs:/app/data/inputs

  falkordb:
    image: falkordb/falkordb@sha256:286d829e23ea4f927d8c06859efb12a3288d00b03746a517f4d8c22b75202015
    volumes:
      - falkordb-data:/data

  honcho-database:
    image: pgvector/pgvector:pg15
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${BENCHMARK_POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - honcho-postgres-data:/var/lib/postgresql/data
      - ./honcho-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  honcho-redis:
    image: redis:8.2
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - honcho-redis-data:/data

  honcho-api:
    image: ${BENCHMARK_HONCHO_IMAGE:-elf-benchmark-honcho:v4}
    entrypoint: ["sh", "/app/docker/entrypoint.sh"]
    depends_on:
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    environment: *honcho-environment
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()
      interval: 3s
      timeout: 5s
      retries: 60

  honcho-deriver:
    image: ${BENCHMARK_HONCHO_IMAGE:-elf-benchmark-honcho:v4}
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      honcho-api:
        condition: service_started
    environment: *honcho-environment

  elf-unit:
    <<: *unit
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      <<: *unit-environment
      ELF_PG_DSN: postgres://elf_benchmark:${BENCHMARK_POSTGRES_PASSWORD}@postgres:5432/elf_benchmark
      ELF_QDRANT_GRPC_URL: http://qdrant:6334
    volumes: *unit-volumes
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - elf

  mem0-unit:
    <<: *unit
    depends_on:
      qdrant:
        condition: service_started
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - mem0

  qmd-unit:
    <<: *unit
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - qmd

  lightrag-unit:
    <<: *unit
    depends_on:
      lightrag:
        condition: service_started
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - lightrag

  pageindex-unit:
    <<: *unit
    image: ${BENCHMARK_PAGEINDEX_IMAGE:-elf-benchmark-pageindex:v4}
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - pageindex

  openviking-unit:
    <<: *unit
    image: ${BENCHMARK_OPENVIKING_IMAGE:-elf-benchmark-openviking:v4}
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - openviking

  graphiti-unit:
    <<: *unit
    image: ${BENCHMARK_GRAPHITI_IMAGE:-elf-benchmark-graphiti:v4}
    depends_on:
      falkordb:
        condition: service_started
    environment:
      <<: *unit-environment
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_DATABASE: elf_benchmark
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - graphiti

  graphrag-unit:
    <<: *unit
    image: ${BENCHMARK_GRAPHRAG_IMAGE:-elf-benchmark-graphrag:v4}
    command:
      - /opt/graphrag-venv/bin/python
      - /opt/benchmark/benchmark-unit.py
      - --target
      - graphrag

  letta-unit:
    <<: *unit
    image: ${BENCHMARK_LETTA_IMAGE:-elf-benchmark-letta:v4}

  openkb-unit:
    <<: *unit
    image: ${BENCHMARK_OPENKB_IMAGE:-elf-benchmark-openkb:v4}
    environment:
      <<: *unit-environment
      OPENKB_TIMEOUT_SECONDS: "1200"
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - openkb

  sag-unit:
    <<: *unit
    image: ${BENCHMARK_SAG_IMAGE:-elf-benchmark-sag:v4}
    depends_on:
      sag-postgres:
        condition: service_healthy
    environment:
      <<: *unit-environment
      DATABASE_URL: postgres://sag_benchmark:${BENCHMARK_POSTGRES_PASSWORD}@sag-postgres:5432/sag_benchmark
      EMBEDDING_DIMENSIONS: "1024"
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - sag

  honcho-unit:
    <<: *unit
    image: ${BENCHMARK_HONCHO_IMAGE:-elf-benchmark-honcho:v4}
    depends_on:
      honcho-api:
        condition: service_started
      honcho-deriver:
        condition: service_started
    environment:
      <<: *unit-environment
      HONCHO_URL: http://honcho-api:8000
      HONCHO_REPO_DIR: /app
    command:
      - python3
      - /opt/benchmark/benchmark-unit.py
      - --target
      - honcho

volumes:
  postgres-data:
  qdrant-data:
  lightrag-data:
  lightrag-inputs:
  falkordb-data:
  sag-postgres-data:
  honcho-postgres-data:
  honcho-redis-data:
